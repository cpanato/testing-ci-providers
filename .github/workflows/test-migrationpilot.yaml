name: "Test MigrationPilot"

# Tracks mickelsamuel/migrationpilot @ main. The `uses:` reference is pinned to
# main's tip SHA (repo policy is no unpinned refs); bump it to re-test.
#
# History: v1.5.1 could not start at all — action.yml declared `using: 'node22'`,
# which the runner rejects (docker/node12/node16/node20/node24 only). main has
# since fixed that to node24. Still broken on main: `dist/` is gitignored
# upstream, so the tag/branch contains no `dist/action/index.js` for the runner
# to execute. The `action` job reproduces that; `action-from-source` builds the
# bundle first, which is the only way the action code actually runs today.
#
# Note the action only does anything on `pull_request` events, and only for
# migration files *changed in that PR*; on any other event it warns, sets
# risk-level=GREEN and returns. Dispatch runs therefore prove startup only.

on:
  pull_request:
    paths:
      - 'migrations/**'
      - '.github/workflows/test-migrationpilot.yaml'
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1' # weekly, to notice when upstream fixes/breaks things

permissions: {}

jobs:
  action:
    name: "action @ main (as published)"
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write # the action posts the report as a PR comment

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: migrationpilot
        uses: mickelsamuel/migrationpilot@e9a2212fc93f275cb4869d6ec5fb811fa4baf18a # main
        # Expected to fail today (no dist bundle upstream); also 002_unsafe.sql
        # is meant to trip `fail-on: critical` once it does run.
        continue-on-error: true
        with:
          migration-path: 'migrations/*.sql'
          pg-version: '17'
          fail-on: 'critical'

      - name: Show action outputs
        run: |
          echo "outcome:    ${{ steps.migrationpilot.outcome }}"
          echo "risk-level: ${{ steps.migrationpilot.outputs.risk-level }}"
          echo "violations: ${{ steps.migrationpilot.outputs.violations }}"
          echo "sarif-file: ${{ steps.migrationpilot.outputs.sarif-file }}"

  action-from-source:
    name: "action @ main (built from source)"
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: 'mickelsamuel/migrationpilot'
          ref: 'main'
          path: '.migrationpilot'
          persist-credentials: false

      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
        with:
          version: '10.28.0'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Build the action bundle
        working-directory: '.migrationpilot'
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
          test -f dist/action/index.js

      - id: migrationpilot
        uses: './.migrationpilot'
        continue-on-error: true # 002_unsafe.sql is meant to trip `fail-on: critical`
        with:
          migration-path: 'migrations/*.sql'
          pg-version: '17'
          fail-on: 'critical'

      - name: Show action outputs
        run: |
          echo "outcome:    ${{ steps.migrationpilot.outcome }}"
          echo "risk-level: ${{ steps.migrationpilot.outputs.risk-level }}"
          echo "violations: ${{ steps.migrationpilot.outputs.violations }}"
          echo "sarif-file: ${{ steps.migrationpilot.outputs.sarif-file }}"

  cli:
    name: "CLI @ main"
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: 'mickelsamuel/migrationpilot'
          ref: 'main'
          path: '.migrationpilot'
          persist-credentials: false

      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
        with:
          version: '10.28.0'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22' # `check` uses fs/promises.glob, which needs node >= 22

      - name: Build the CLI
        working-directory: '.migrationpilot'
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
          test -f dist/cli.cjs

      - name: Safe migration must pass
        run: node .migrationpilot/dist/cli.cjs analyze migrations/001_safe.sql --fail-on critical

      - name: Unsafe migration must fail
        run: |
          if node .migrationpilot/dist/cli.cjs analyze migrations/002_unsafe.sql --fail-on critical; then
            echo "::error::expected 002_unsafe.sql to fail on critical violations"
            exit 1
          fi
          echo "unsafe migration correctly flagged"

      - name: JSON report for the whole directory
        run: node .migrationpilot/dist/cli.cjs check migrations/ --pattern "*.sql" --format json --fail-on never
